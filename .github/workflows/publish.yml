# Publishes to npm with provenance when a version tag is pushed.
# Auth is npm trusted publishing (OIDC): no npm token is stored in this repo.
# The package's trusted publisher on npmjs.com must name this repo and this file (publish.yml).
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@^11.5.1

      - name: Tag must match package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
